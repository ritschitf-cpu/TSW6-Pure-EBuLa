name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create . --platforms=android --project-name tsw6_pure_ebula --org de.pureebula
      - name: Restore analyzer configuration
        run: cp ci/analysis_options.yaml analysis_options.yaml

      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Generate launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ebula_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#000000" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M20,24h68v10h-68zM20,49h52v10h-52zM20,74h68v10h-68z"/>
          </vector>
          EOF
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read().replace('android:label="tsw6_pure_ebula"','android:label="EBuLa"').replace('android:theme="@style/LaunchTheme"','android:icon="@drawable/ebula_launcher" android:theme="@style/LaunchTheme"')
          open(p,'w').write(s)
          PY
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TSW6-Pure-EBuLa
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
