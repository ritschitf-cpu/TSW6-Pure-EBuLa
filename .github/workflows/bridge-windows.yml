name: Build Pure EBuLa Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --name PureEBuLaBridge bridge/pure_ebula_bridge.py

      - name: Upload Bridge
        uses: actions/upload-artifact@v4
        with:
          name: PureEBuLaBridge-windows
          path: dist/PureEBuLaBridge.exe
          retention-days: 90
